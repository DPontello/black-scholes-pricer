[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "options-engine"
version = "0.3.0"
description = "Options pricing, simulation and risk analytics engine — Black-Scholes core, hexagonal architecture, stdlib-only domain"
readme = "README.md"
requires-python = ">=3.12"
# Regra de arquitetura: o pacote de runtime NÃO tem dependências.
# O domínio é stdlib-only; scipy/QuantLib existem apenas no job de CI
# do oráculo (tests/oracle/requirements.txt), nunca aqui.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.5",
    "import-linter>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/options_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.coverage.run]
source = ["options_engine"]
branch = true

[tool.coverage.report]
# Gate global; o kernel é mantido em 100% de linhas por critério de aceite
# da Sprint 1 (verificado por inspeção do relatório no review).
fail_under = 95

# Regras de arquitetura executáveis (docs/ARCHITECTURE.md §1): a regra de
# dependência aponta sempre para dentro e quebra o build quando violada.
[tool.importlinter]
root_packages = ["options_engine"]
include_external_packages = true

# Contrato de camadas (Sprint 3): config -> adapters -> application -> domain.
# Camada de cima pode importar as de baixo; o inverso quebra o build.
[[tool.importlinter.contracts]]
name = "camadas hexagonais (config -> adapters -> application -> domain)"
type = "layers"
layers = [
    "options_engine.config",
    "options_engine.adapters",
    "options_engine.application",
    "options_engine.domain",
]

[[tool.importlinter.contracts]]
name = "domain e application são stdlib-only (sem frameworks, sem libs numéricas)"
type = "forbidden"
source_modules = ["options_engine.domain", "options_engine.application"]
forbidden_modules = [
    "fastapi",
    "pydantic",
    "starlette",
    "numpy",
    "pandas",
    "scipy",
    "requests",
    "httpx",
    "sqlalchemy",
]

[tool.mypy]
strict = true
mypy_path = "src"
files = ["src", "tests"]
python_version = "3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
