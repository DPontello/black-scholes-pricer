[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "options-engine"
version = "0.1.0"
description = "Options pricing, simulation and risk analytics engine — Black-Scholes core, hexagonal architecture, stdlib-only domain"
readme = "README.md"
requires-python = ">=3.12"
# Regra de arquitetura: o pacote de runtime NÃO tem dependências.
# O domínio é stdlib-only; scipy/QuantLib existem apenas no job de CI
# do oráculo (tests/oracle/requirements.txt), nunca aqui.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/options_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.coverage.run]
source = ["options_engine"]
branch = true

[tool.mypy]
strict = true
mypy_path = "src"
files = ["src", "tests"]
python_version = "3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
